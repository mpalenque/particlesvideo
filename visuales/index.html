<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Visuales LED</title>
  <style>
    html, body { margin: 0; padding: 0; background: #000; overflow: hidden; height: 100%; }
    #stage { position: absolute; top: 0; left: 0; transform-origin: top left; }
    #stage canvas { display: block; }
    #fps { position: absolute; top: 4px; left: 4px; font: 12px monospace; color: #0f0; pointer-events: none; z-index: 10; }
    #fatal { position: absolute; inset: 0; background: #000; color: #f55; font: 16px monospace; padding: 24px; white-space: pre-wrap; }
  </style>
</head>
<body>
  <div id="stage"></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
